# ZibaldOne: una release sola per ogni versione, con terminale (wheel), Windows (zip) e Android (APK).
# Parte da un tag `zibaldone-vX.Y.Z` o a mano dalla scheda Actions. Senza tag costruisce tutto ma non pubblica.
# Sostituisce zibaldone-apk.yml e zibaldone-windows.yml. Piano: ZibaldOne/team/piano-ci-cd.md
name: ZibaldOne Release

on:
  push:
    tags: ["zibaldone-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da costruire e pubblicare (es. zibaldone-v0.2.8). Vuoto: costruisce il branch scelto, senza release."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: zibaldone-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # Il runner Windows scrive in cp1252: l'output di flet (rich) con le emoji andrebbe in UnicodeEncodeError.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  check:
    name: Test e versione
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        working-directory: ZibaldOne
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa e fai girare i test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"
          python -m pytest -q
      - name: Versione e numero di build
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(python -c "import zibaldone; print(zibaldone.__version__)")
          BUILD_NUMBER=$(python -c "from zibaldone.cloud.updates import version_code; print(version_code('$VERSION'))")
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; fi
          if [ -n "$TAG" ] && [ "$TAG" != "zibaldone-v$VERSION" ]; then
            echo "::error::il tag $TAG non corrisponde alla versione nel codice ($VERSION)"
            exit 1
          fi
          if [ -n "$TAG" ] && [ ! -f "docs/versioni/v$VERSION.md" ]; then
            echo "::error::manca docs/versioni/v$VERSION.md (le note della release)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ZibaldOne $VERSION, versionCode $BUILD_NUMBER, tag ${TAG:-nessuno}"

  terminal:
    name: Terminale (wheel)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ZibaldOne
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Costruisci e prova la wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          pip install dist/*.whl
          zbone --help
      - uses: actions/upload-artifact@v7
        with:
          name: terminal
          path: |
            ZibaldOne/dist/*.whl
            ZibaldOne/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows (zip)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: ZibaldOne
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      - name: Client OAuth di Google
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_JSON" ]; then
            printf '%s' "$GOOGLE_CLIENT_JSON" > src/zibaldone/cloud/google_client.json
            python -c "import json; json.load(open('src/zibaldone/cloud/google_client.json'))"
          else
            echo "::warning::manca il segreto GOOGLE_CLIENT_JSON: l'app funziona, ma senza accesso con Google"
          fi
      - name: Costruisci l'app per Windows
        env:
          VERSION: ${{ needs.check.outputs.version }}
          BUILD_NUMBER: ${{ needs.check.outputs.build_number }}
        run: |
          flet build windows --yes --build-version "$VERSION" --build-number "$BUILD_NUMBER"
          if [ ! -f build/windows/ZibaldOne.exe ]; then echo "::error::flet build non ha prodotto ZibaldOne.exe"; ls -R build | head -50; exit 1; fi
      - name: Zip
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist/pack
          cp -r build/windows dist/pack/ZibaldOne
          powershell -NoProfile -Command "Compress-Archive -Path dist/pack/ZibaldOne -DestinationPath dist/ZibaldOne-$VERSION-windows.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ZibaldOne/dist/*.zip
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android (APK)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ZibaldOne
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      - name: Client OAuth di Google
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_JSON" ]; then
            printf '%s' "$GOOGLE_CLIENT_JSON" > src/zibaldone/cloud/google_client.json
            python -c "import json; json.load(open('src/zibaldone/cloud/google_client.json'))"
          else
            echo "::warning::manca il segreto GOOGLE_CLIENT_JSON: l'APK funziona, ma senza accesso con Google"
          fi
      - name: Chiave di firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zibaldone.jks"
          else
            echo "::warning::manca il segreto ANDROID_KEYSTORE_BASE64: APK firmato con una chiave di prova, per aggiornarlo bisognerà disinstallare"
          fi
      - name: Costruisci l'APK
        env:
          VERSION: ${{ needs.check.outputs.version }}
          BUILD_NUMBER: ${{ needs.check.outputs.build_number }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'zibaldone' }}
        run: |
          if [ -f "$RUNNER_TEMP/zibaldone.jks" ]; then
            export FLET_ANDROID_SIGNING_KEY_STORE="$RUNNER_TEMP/zibaldone.jks"
          else
            unset FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD FLET_ANDROID_SIGNING_KEY_PASSWORD FLET_ANDROID_SIGNING_KEY_ALIAS
          fi
          flet build apk --yes --build-version "$VERSION" --build-number "$BUILD_NUMBER"
          mkdir -p dist
          APK=$(find build/apk -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::flet build non ha prodotto un APK"; exit 1; fi
          cp "$APK" "dist/ZibaldOne-$VERSION-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ZibaldOne/dist/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Pubblica la release
    needs: [check, terminal, windows, android]
    # Una confezione che fallisce non blocca le altre: la release esce con quelle riuscite e il lavoro lo dice.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.tag != '' && needs.terminal.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Somme di controllo e release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          RESULTS: terminale=${{ needs.terminal.result }} windows=${{ needs.windows.result }} android=${{ needs.android.result }}
        run: |
          cd files
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          for r in $RESULTS; do case "$r" in *=success) ;; *) echo "::warning::confezione non riuscita, la release esce senza: $r";; esac; done
          cd ..
          # Le release restano "prerelease" fino alla prima versione stabile (1.0).
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" files/* --clobber
          else
            gh release create "$TAG" files/* --verify-tag --prerelease \
              --title "ZibaldOne $VERSION" --notes-file "ZibaldOne/docs/versioni/v$VERSION.md"
          fi
