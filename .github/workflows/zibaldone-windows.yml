# ZibaldOne: builds the Windows desktop app (flet build windows) and zips the folder.
# By hand (Actions tab): the zip stays among the run's artifacts. On a pushed tag `zibaldone-vX.Y.Z`:
# it is also attached to the GitHub release. The .exe is not signed: SmartScreen warns (docs/utente/guida-tester.md).
name: ZibaldOne Windows

on:
  push:
    tags: ["zibaldone-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da costruire e pubblicare (es. zibaldone-v0.2.7). Vuoto: costruisce il branch scelto, senza release."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: zibaldone-windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: ZibaldOne
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa e fai girare i test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"
          python -m pytest -q

      - name: Versione e numero di build
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(python -c "import zibaldone; print(zibaldone.__version__)")
          BUILD_NUMBER=$(python -c "from zibaldone.cloud.updates import version_code; print(version_code('$VERSION'))")
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; fi
          if [ -n "$TAG" ] && [ "$TAG" != "zibaldone-v$VERSION" ]; then
            echo "::error::il tag $TAG non corrisponde alla versione nel codice ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ZibaldOne $VERSION, versionCode $BUILD_NUMBER, tag ${TAG:-nessuno}"

      - name: Client OAuth di Google
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_JSON" ]; then
            printf '%s' "$GOOGLE_CLIENT_JSON" > src/zibaldone/cloud/google_client.json
            python -c "import json; json.load(open('src/zibaldone/cloud/google_client.json'))"
          else
            echo "::warning::manca il segreto GOOGLE_CLIENT_JSON: l'app funziona, ma senza accesso con Google"
          fi

      - name: Costruisci l'app per Windows
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          flet build windows --yes --build-version "$VERSION" --build-number "$BUILD_NUMBER"
          if [ ! -f build/windows/ZibaldOne.exe ]; then echo "::error::flet build non ha prodotto ZibaldOne.exe"; ls -R build | head -50; exit 1; fi

      - name: Zip e somme di controllo
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/pack
          cp -r build/windows dist/pack/ZibaldOne
          ZIP="ZibaldOne-$VERSION-windows.zip"
          powershell -NoProfile -Command "Compress-Archive -Path dist/pack/ZibaldOne -DestinationPath dist/$ZIP"
          (cd dist && sha256sum "$ZIP" > "SHA256SUMS-windows.txt")
          ls -l dist; cat dist/SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ZibaldOne-${{ steps.version.outputs.version }}-windows
          path: |
            ZibaldOne/dist/*.zip
            ZibaldOne/dist/SHA256SUMS-windows.txt
          if-no-files-found: error

      - name: Pubblica nella pagina delle versioni
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="dist/ZibaldOne-$VERSION-windows.zip"
          # Il lavoro dell'APK può aver già creato la release: in quel caso si aggiunge e basta.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --prerelease \
              --title "ZibaldOne $VERSION" --notes-file "docs/versioni/v$VERSION.md" || true
          fi
          gh release upload "$TAG" "$ZIP" dist/SHA256SUMS-windows.txt --clobber
