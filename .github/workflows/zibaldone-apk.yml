# ZibaldOne: builds the Android APK and attaches it to the GitHub release.
# Runs on a pushed tag `zibaldone-vX.Y.Z`, or by hand from the Actions tab.
# How to set it up: ZibaldOne/docs/sviluppo/rilascio-android.md
name: ZibaldOne APK

on:
  push:
    tags: ["zibaldone-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da costruire e pubblicare (es. zibaldone-v0.1.5). Vuoto: costruisce il branch scelto, senza release."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: zibaldone-apk-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ZibaldOne
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa e fai girare i test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"
          python -m pytest -q

      - name: Versione e numero di build
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(python -c "import zibaldone; print(zibaldone.__version__)")
          BUILD_NUMBER=$(python -c "from zibaldone.cloud.updates import version_code; print(version_code('$VERSION'))")
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; fi
          if [ -n "$TAG" ] && [ "$TAG" != "zibaldone-v$VERSION" ]; then
            echo "::error::il tag $TAG non corrisponde alla versione nel codice ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ZibaldOne $VERSION, versionCode $BUILD_NUMBER, tag ${TAG:-nessuno}"

      - name: Client OAuth di Google
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_JSON" ]; then
            printf '%s' "$GOOGLE_CLIENT_JSON" > src/zibaldone/cloud/google_client.json
            python -c "import json; json.load(open('src/zibaldone/cloud/google_client.json'))"
          else
            echo "::warning::manca il segreto GOOGLE_CLIENT_JSON: l'APK funziona, ma senza accesso con Google"
          fi

      - name: Chiave di firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zibaldone.jks"
          else
            echo "::warning::manca il segreto ANDROID_KEYSTORE_BASE64: APK firmato con una chiave di prova, per aggiornarlo bisognerà disinstallare"
          fi

      - name: Costruisci l'APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'zibaldone' }}
        run: |
          if [ -f "$RUNNER_TEMP/zibaldone.jks" ]; then
            export FLET_ANDROID_SIGNING_KEY_STORE="$RUNNER_TEMP/zibaldone.jks"
          else
            unset FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD FLET_ANDROID_SIGNING_KEY_PASSWORD FLET_ANDROID_SIGNING_KEY_ALIAS
          fi
          flet build apk --yes --build-version "$VERSION" --build-number "$BUILD_NUMBER"
          mkdir -p dist
          APK=$(find build/apk -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::flet build non ha prodotto un APK"; exit 1; fi
          cp "$APK" "dist/ZibaldOne-$VERSION.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ZibaldOne-${{ steps.version.outputs.version }}-apk
          path: ZibaldOne/dist/*.apk
          if-no-files-found: error

      - name: Pubblica nella pagina delle versioni
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK="dist/ZibaldOne-$VERSION.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --verify-tag --prerelease \
              --title "ZibaldOne $VERSION" --notes-file "docs/versioni/v$VERSION.md"
          fi
