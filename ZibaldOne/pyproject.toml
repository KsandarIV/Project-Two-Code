[project]
name = "zibaldone"
dynamic = ["version"]
description = "ZibaldOne: a composable, local-first journal built from user-defined blocks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
notifiche = [
  "desktop-notifier>=6.1,<7",
]
# Flet is pinned: with a different flet-desktop, Flet 1.0.4 would pip-install it by itself at start.
ui = [
  "flet[desktop]==1.0.5",
]
web = [
  "flet[web]==1.0.5",
]
# `flet build apk` (docs/sviluppo/rilascio-android.md): Flutter and the Android SDK come by themselves.
build = [
  "flet[cli]==1.0.5",
]

[project.scripts]
zibaldone = "zibaldone.cli.app:main"
zbone = "zibaldone.cli.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "zibaldone.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zibaldone = ["packs/*.zbpack.json", "cloud/google_client.json"]

# * — `flet build`: the APK for testers (0.1.1) and, later, the Windows build —

[tool.flet]
product = "ZibaldOne"
artifact = "ZibaldOne"
org = "it.zibaldone"
bundle_id = "it.zibaldone.app"
company = "ZibaldOne"
copyright = "Copyright (C) 2026 Alex"
# Fill behind the icon (src/assets/icon_android.png is the transparent foreground of the Android adaptive icon).
icon_background = "#0D0E15"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.android]
# KAN-107: the key of the encrypted database stays in the system keystore; KAN-108: fingerprint or face open it;
# KAN-12: pyjnius reaches Android's download manager and installer for the new APK (not pinned, as in the Flet docs:
# the build takes the one Flet ships for its Python)
dependencies = ["flet==1.0.5", "flet-permission-handler==1.0.4", "flet-secure-storage==1.0.5", "flet-local-auth==1.0.5", "pyjnius"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
# 0.3.3: to make ZibaldOne/Data in the main storage and write the backup files there (asked at runtime, from a button)
"android.permission.MANAGE_EXTERNAL_STORAGE" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
# KAN-108: fingerprint or face before the diary opens
"android.permission.USE_BIOMETRIC" = true
# KAN-12: open the installer on the APK the app downloaded (Android still asks the user to confirm)
"android.permission.REQUEST_INSTALL_PACKAGES" = true

[tool.flet.windows]
dependencies = ["flet==1.0.5", "flet-secure-storage==1.0.5", "flet-local-auth==1.0.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
