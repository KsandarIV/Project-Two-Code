[project]
name = "zibaldone"
version = "0.2.0"
description = "ZibaldOne: a composable, local-first journal built from user-defined blocks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
zibaldone = "zibaldone.cli.app:main"
zbone = "zibaldone.cli.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
